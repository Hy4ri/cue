name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-flake:
    needs: goreleaser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: nix-release-update
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: cachix/install-nix-action@v31.11.1

      - name: Update release version and archive hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/test_update_nix_release.py -v
          python3 scripts/update-nix-release.py

      - name: Verify the updated package
        run: |
          nix flake check --all-systems --no-build
          nix build .#cue --no-link
          nix run .#cue -- --version

      - name: Open or update the release pin PR
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ github.token }}
          branch: nix/update-release
          base: ${{ github.event.repository.default_branch }}
          add-paths: package.nix
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: 'chore(nix): update Cue release'
          title: Update Cue release for Nix
          body: |
            Updates the Nix package to the latest stable Cue release and its GitHub-provided archive checksums.

            Both architecture outputs were evaluated and the x86_64 package was verified before opening this PR.
          draft: false
